[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "castepinput"
description = "A simple CASTEP input files parser/writer"
authors = [{name = "Bonan Zhu", email = "zhubonan@outlook.com"}]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta"
    ]
dynamic = ["version"]

dependencies = ["numpy", "monty"]
requires-python = ">=3.9"

[project.urls]
Home = "https://github.com/zhubonan/castepinput"

[project.optional-dependencies]
"pre-commit" = [
                  "pre-commit", "pylint-pytest"
              ]
test = ["pytest", "pytest-cov", "coverage"]

[tool.hatch.version]
path = "castepinput/__init__.py"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]
